name: Daily model retrain

on:
  schedule:
    # 06:05 UTC every day — 5 min after the in-process scheduler as a backup
    - cron: "5 6 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger retrain
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.RAILWAY_API_URL }}/api/wc/retrain" \
            -H "X-Retrain-Token: ${{ secrets.RETRAIN_SECRET_TOKEN }}")
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "Retrain trigger failed with status $response"
            exit 1
          fi

      - name: Wait and verify
        run: |
          echo "Waiting 90s for retrain to complete..."
          sleep 90
          status=$(curl -s "${{ secrets.RAILWAY_API_URL }}/api/wc/retrain/status")
          echo "Status: $status"
          echo "$status" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if d.get('error'):
              print('RETRAIN ERROR:', d['error'])
              sys.exit(1)
          print('last:', d.get('last'), '| running:', d.get('running'))
          "
